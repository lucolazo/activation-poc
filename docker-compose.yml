x-env: &env
  KAFKA_BROKERS: kafka:9092
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
x-deps: &deps
  kafka-init: { condition: service_completed_successfully }
  mongo-init: { condition: service_completed_successfully }

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 60000
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 20s
      retries: 60
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    volumes: ["./docker/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.0.0
    ports: ["8080:8080"]
    depends_on: { kafka: { condition: service_healthy } }
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  mongo:
    image: mongo:7
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "0.25",
      ]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/27017'"]
      interval: 10s
      timeout: 20s
      retries: 60
      start_period: 30s

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on: { mongo: { condition: service_healthy } }
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - |
        try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }
        let ok = false;
        while (!ok) { try { ok = rs.status().myState === 1 } catch (e) {} if (!ok) sleep(1000) }
        print('Replica set PRIMARY listo')
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["8025:8025"]

  activation-api:
    build: { context: ., args: { APP: activation-api } }
    ports: ["3000:3000"]
    restart: on-failure
    depends_on: *deps
    environment:
      {
        <<: *env,
        KAFKA_CLIENT_ID: activation-api,
        KAFKA_GROUP_ID: activation-api,
      }

  billing-service:
    build: { context: ., args: { APP: billing-service } }
    restart: on-failure
    depends_on: *deps
    environment:
      { <<: *env, KAFKA_CLIENT_ID: billing, KAFKA_GROUP_ID: billing-svc }

  provisioning-service:
    build: { context: ., args: { APP: provisioning-service } }
    restart: on-failure
    depends_on: *deps
    environment:
      {
        <<: *env,
        KAFKA_CLIENT_ID: provisioning,
        KAFKA_GROUP_ID: provisioning-svc,
      }

  notification-service:
    build: { context: ., args: { APP: notification-service } }
    restart: on-failure
    depends_on: *deps
    environment:
      {
        <<: *env,
        KAFKA_CLIENT_ID: notification,
        KAFKA_GROUP_ID: notification-svc,
        SMTP_HOST: mailhog,
      }

  crm-analytics-service:
    build: { context: ., args: { APP: crm-analytics-service } }
    restart: on-failure
    depends_on: *deps
    environment:
      {
        <<: *env,
        KAFKA_CLIENT_ID: crm-analytics,
        KAFKA_GROUP_ID: crm-analytics,
      }

  demo-ui:
    build: ./apps/demo-ui
    ports: ["5173:5173"]
    depends_on: [activation-api]

  # Escenario 5: docker compose --profile loyalty up -d loyalty-service
  loyalty-service:
    profiles: ["loyalty"]
    build: { context: ., args: { APP: loyalty-service } }
    restart: on-failure
    depends_on: *deps
    environment: { <<: *env, KAFKA_CLIENT_ID: loyalty, KAFKA_GROUP_ID: loyalty }
